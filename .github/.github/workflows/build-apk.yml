name: بناء تطبيق العربية بتلمسان (APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dr-ali-krim-tlemcen/dr.-ali-krim-main

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: تهيئة Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة أدوات أندرويد (Android SDK)
        uses: android-actions/setup-android@v3

      - name: تثبيت مكوّنات SDK المطلوبة
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: فكّ تشفير مفتاح التوقيع debug.keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: تنزيل Gradle 9.3.1 والبناء به مباشرةً
        run: |
          echo "== تنزيل Gradle 9.3.1 =="
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          GRADLE="$HOME/gradle-dist/gradle-9.3.1/bin/gradle"
          echo "== إصدار Gradle المستعمَل =="
          "$GRADLE" --version
          echo "== بدء البناء =="
          "$GRADLE" assembleDebug --no-configuration-cache --stacktrace

      - name: رفع ملف APK كأرشيف قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: dr-ali-krim-tlemcen/dr.-ali-krim-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

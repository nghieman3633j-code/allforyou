name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode debug keystore
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          if [ -f "$TARGET_DIR/debug.keystore.base64" ]; then
            base64 -d "$TARGET_DIR/debug.keystore.base64" > "$TARGET_DIR/debug.keystore"
          else
            echo "المفتاح غير موجود، سيتم إنشاء مفتاح افتراضي"
            keytool -genkey -v -keystore "$TARGET_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode google-services.json (Firebase)
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          mkdir -p "$TARGET_DIR"
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"

      - name: Download Gradle and build Full APK
        run: |
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          
          # تطهير وحذف المجلد الفرعي وملفات الكوتلن لإلغاء التشابك تماماً
          rm -rf build.gradle.kts settings.gradle.kts app/ gradle.properties

          # ─── 1. settings.gradle ───────────────────────────────────────────
          cat > settings.gradle << 'SETTINGS'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'arabic-tlemcen-apk'
SETTINGS

          # ─── 2. gradle.properties ─────────────────────────────────────────
          cat > gradle.properties << 'PROPS'
android.useAndroidX=true
android.enableJetifier=true
PROPS

          # ─── 3. build.gradle ──────────────────────────────────────────────
          cat > build.gradle << 'GRADLE'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.arabic.tlemcen.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arabic.tlemcen.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            res.srcDirs     = ['src/main/res']
            assets.srcDirs  = ['src/main/assets']
            java.srcDirs    = ['src/main/java', 'src/main/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
GRADLE

          # ─── 4. هيكل المجلدات الأساسية ───────────────────────────────────
          mkdir -p src/main/java/com/arabic/tlemcen/app
          mkdir -p src/main/res/values
          mkdir -p src/main/res/layout
          mkdir -p src/main/assets

          # ─── 5. AndroidManifest.xml ───────────────────────────────────────
          cat > src/main/AndroidManifest.xml << 'MANIFEST'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.Light.NoActionBar">

        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

    </application>

</manifest>
MANIFEST

          # ─── 6. MainActivity.kt ───────────────────────────────────────────
          cat > src/main/java/com/arabic/tlemcen/app/MainActivity.kt << 'KOTLIN'
package com.arabic.tlemcen.app

import androidx.appcompat.app.AppCompatActivity
import android.os.Bundle

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
    }
}
KOTLIN

          # ─── 7. activity_main.xml ─────────────────────────────────────────
          cat > src/main/res/layout/activity_main.xml << 'LAYOUT'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:gravity="center"
    android:orientation="vertical">

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="@string/app_name"
        android:textSize="24sp" />

</LinearLayout>
LAYOUT

          # ─── 8. strings.xml ───────────────────────────────────────────────
          cat > src/main/res/values/strings.xml << 'STRINGS'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">Arabic Tlemcen</string>
</resources>
STRINGS

          # ─── 9. تحميل Gradle وتشغيل البناء ──────────────────────────────
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"

          "$HOME/gd/gradle-8.2/bin/gradle" clean
          "$HOME/gd/gradle-8.2/bin/gradle" assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/outputs/apk/debug/*.apk"
          if-no-files-found: error

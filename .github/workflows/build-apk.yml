name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode debug keystore
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          if [ -f "$TARGET_DIR/debug.keystore.base64" ]; then
            base64 -d "$TARGET_DIR/debug.keystore.base64" > "$TARGET_DIR/debug.keystore"
          else
            echo "المفتاح غير موجود، سيتم إنشاء مفتاح افتراضي"
            keytool -genkey -v -keystore "$TARGET_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode google-services.json (Firebase)
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main/app"
          mkdir -p "$TARGET_DIR"
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"

      - name: Download Gradle and build Full APK
        run: |
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          
          # تنظيف كامل للملفات المؤقتة المتعارضة
          rm -f build.gradle.kts settings.gradle.kts app/build.gradle.kts app/build.gradle
          
          # البحث البرمجي التلقائي عن المسار الحقيقي لمجلد الموارد (res) لتفادي أخطاء AAPT
          REAL_RES_DIR=$(find . -type d -name "res" | grep -v "build" | head -n 1 | sed 's|^\./||')
          REAL_MANIFEST=$(find . -name "AndroidManifest.xml" | grep -v "build" | head -n 1 | sed 's|^\./||')
          REAL_ASSETS=$(find . -type d -name "assets" | grep -v "build" | head -n 1 | sed 's|^\./||')
          
          # إذا لم يعثر على مجلد assets الافتراضي نضع مساراً احتياطياً
          if [ -z "$REAL_ASSETS" ]; then REAL_ASSETS="app/src/main/assets"; fi
          
          echo "المسار المكتشف للموارد: $REAL_RES_DIR"
          echo "المسار المكتشف للمانيفست: $REAL_MANIFEST"
          
          # 1. إنشاء ملف settings.gradle القياسي المستقر
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'arabic-tlemcen-apk'" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 2. إنشاء ملف build.gradle الرئيسي
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' } }" > build.gradle
          
          # 3. إنشاء ملف بناء التطبيق الداخلي app/build.gradle وحقن المسارات المكتشفة ديناميكياً
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "apply plugin: 'org.jetbrains.kotlin.android'" >> app/build.gradle
          echo "android {" >> app/build.gradle
          echo "    namespace 'com.arabic.tlemcen.app'" >> app/build.gradle
          echo "    compileSdk 34" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId 'com.arabic.tlemcen.app'" >> app/build.gradle
          echo "        minSdk 24" >> app/build.gradle
          echo "        targetSdk 34" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName '1.0'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "    sourceSets {" >> app/build.gradle
          echo "        main {" >> app/build.gradle
          echo "            manifest.srcFile '${REAL_MANIFEST}'" >> app/build.gradle
          echo "            res.srcDirs = ['${REAL_RES_DIR}']" >> app/build.gradle
          echo "            assets.srcDirs = ['${REAL_ASSETS}']" >> app/build.gradle
          echo "            java.srcDirs = ['app/src/main/java', 'app/src/main/kotlin']" >> app/build.gradle
          echo "        }" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle
          
          # تحميل أداة Gradle 8.2
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          
          # إطلاق البناء النظيف النهائي والتجميع الشامل
          "$HOME/gd/gradle-8.2/bin/gradle" clean
          "$HOME/gd/gradle-8.2/bin/gradle" assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode google-services.json
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          mkdir -p "$TARGET_DIR"
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"

      - name: Build APK
        run: |
          set -e
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/outputs/apk/debug/*.apk"
          if-no-files-found: error

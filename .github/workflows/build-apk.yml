- name: Download Gradle and build Full APK
        run: |
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          
          # تنظيف كامل للملفات المؤقتة المتعارضة
          rm -f build.gradle.kts settings.gradle.kts app/build.gradle.kts app/build.gradle
          
          # البحث البرمجي التلقائي مع تجنب حساسية حالة الأحرف لتفادي أخطاء AAPT
          REAL_RES_DIR=$(find . -type d -iname "res" | grep -v "build" | head -n 1 | sed 's|^\./||')
          REAL_MANIFEST=$(find . -iname "AndroidManifest.xml" | grep -v "build" | head -n 1 | sed 's|^\./||')
          REAL_ASSETS=$(find . -type d -iname "assets" | grep -v "build" | head -n 1 | sed 's|^\./||')
          
          # وضع مسارات افتراضية آمنة في حال فشل البحث التلقائي لمنع أخطاء (Path may not be null)
          if [ -z "$REAL_RES_DIR" ]; then REAL_RES_DIR="app/src/main/res"; fi
          if [ -z "$REAL_MANIFEST" ]; then REAL_MANIFEST="app/src/main/AndroidManifest.xml"; fi
          if [ -z "$REAL_ASSETS" ]; then REAL_ASSETS="app/src/main/assets"; fi
          
          echo "المسار المكتشف للموارد: $REAL_RES_DIR"
          echo "المسار المكتشف للمانيفست: $REAL_MANIFEST"
          echo "المسار المكتشف للأصول: $REAL_ASSETS"
          
          # 1. إنشاء ملف settings.gradle القياسي المستقر
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'arabic-tlemcen-apk'" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 2. إنشاء ملف build.gradle الرئيسي
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' } }" > build.gradle
          
          # 3. إنشاء ملف بناء التطبيق الداخلي app/build.gradle وحقن المسارات المكتشفة بربطها بمجلد الجذر
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "apply plugin: 'org.jetbrains.kotlin.android'" >> app/build.gradle
          echo "android {" >> app/build.gradle
          echo "    namespace 'com.arabic.tlemcen.app'" >> app/build.gradle
          echo "    compileSdk 34" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId 'com.arabic.tlemcen.app'" >> app/build.gradle
          echo "        minSdk 24" >> app/build.gradle
          echo "        targetSdk 34" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName '1.0'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "    sourceSets {" >> app/build.gradle
          echo "        main {" >> app/build.gradle
          echo "            manifest.srcFile rootProject.file('${REAL_MANIFEST}')" >> app/build.gradle
          echo "            res.srcDirs = [rootProject.file('${REAL_RES_DIR}')]" >> app/build.gradle
          echo "            assets.srcDirs = [rootProject.file('${REAL_ASSETS}')]" >> app/build.gradle
          echo "            java.srcDirs = [rootProject.file('app/src/main/java'), rootProject.file('app/src/main/kotlin')]" >> app/build.gradle
          echo "        }" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle
          
          # تحميل أداة Gradle 8.2
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          
          # إطلاق البناء النظيف النهائي والتجميع الشامل
          "$HOME/gd/gradle-8.2/bin/gradle" clean
          "$HOME/gd/gradle-8.2/bin/gradle" assembleDebug --no-daemon --no-configuration-cache

name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # ✅ المجلد الصحيح — تصحيح الخطأ الرئيسي (كان: working-directory: .)
        working-directory: dr-ali-krim-tlemcen/dr.-ali-krim-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode debug keystore
        run: |
          FILE_PATH=$(find . -name "debug.keystore.base64" -print -quit)
          if [ -n "$FILE_PATH" ]; then
            DIR_PATH=$(dirname "$FILE_PATH")
            base64 -d "$FILE_PATH" > "$DIR_PATH/debug.keystore"
            echo "✅ تم فك ترميز debug.keystore من $FILE_PATH"
          else
            echo "⚠️ الملف debug.keystore.base64 غير موجود، إنشاء مفتاح افتراضي..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create env files for secrets plugin
        run: |
          printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\n' > .env.example
          cp .env.example .env

      - name: Decode google-services.json (Firebase)
        run: |
          # ✅ التأكد من وجود مجلد app/ قبل الكتابة
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          echo "✅ تم إنشاء app/google-services.json"

      - name: Download Gradle 9.3.1 and build
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          "$HOME/gd/gradle-9.3.1/bin/gradle" --version
          "$HOME/gd/gradle-9.3.1/bin/gradle" assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: dr-ali-krim-tlemcen/dr.-ali-krim-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

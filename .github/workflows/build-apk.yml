name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode debug keystore
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          if [ -f "$TARGET_DIR/debug.keystore.base64" ]; then
            base64 -d "$TARGET_DIR/debug.keystore.base64" > "$TARGET_DIR/debug.keystore"
          else
            echo "المفتاح غير موجود، سيتم إنشاء مفتاح افتراضي"
            keytool -genkey -v -keystore "$TARGET_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode google-services.json (Firebase)
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          mkdir -p "$TARGET_DIR"
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"

      - name: Create AndroidManifest.xml and resource directories
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          mkdir -p "$TARGET_DIR/src/main/res/values"
          mkdir -p "$TARGET_DIR/src/main/assets"
          mkdir -p "$TARGET_DIR/src/main/java/com/arabic/tlemcen/app"
          
          cat <<EOF > "$TARGET_DIR/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.arabic.tlemcen.app">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat <<EOF > "$TARGET_DIR/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Arabic Tlemcen App</string>
          </resources>
          EOF
          
          cat <<EOF > "$TARGET_DIR/src/main/res/values/styles.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.DarkActionBar" />
          </resources>
          EOF
          
          cat <<EOF > "$TARGET_DIR/src/main/java/com/arabic/tlemcen/app/MainActivity.java"
          package com.arabic.tlemcen.app;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Download Gradle and build Full APK
        run: |
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          rm -rf build.gradle.kts settings.gradle.kts app/
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() } 
          }
          rootProject.name = 'arabic-tlemcen-apk'
          EOF
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.arabic.tlemcen.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.arabic.tlemcen.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      res.srcDirs = ['src/main/res']
                      assets.srcDirs = ['src/main/assets']
                      java.srcDirs = ['src/main/java']
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          "$HOME/gd/gradle-8.2/bin/gradle" clean
          "$HOME/gd/gradle-8.2/bin/gradle" assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/outputs/apk/debug/*.apk"
          if-no-files-found: error


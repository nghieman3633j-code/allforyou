name: Build Arabic Tlemcen APK (Native)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد لغة جافا
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد أداة Gradle وضبط صلاحيات تشغيل gradlew تلقائياً
      - name: Setup Gradle and Fix Permissions
        uses: gradle/actions/setup-gradle@v3

      # 4. بناء التطبيق باستخدام Gradle المباشر
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # 5. حفظ ملف الـ APK الناتج
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlemcen-native-apk
          path: app/build/outputs/apk/release/app-release.apk

name: Build Arabic Tlemcen APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود المصدري للمشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد لغة جافا (مطلوبة لبناء أندرويد)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة فلوتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. جلب حزم ومكتبات فلوتر
      - name: Install dependencies
        run: flutter pub get

      # 5. حل المشكلة: إعطاء صلاحية التشغيل لملف gradlew داخل مجلد android
      - name: Make Gradlew Executable
        run: set -e; chmod +x android/gradlew

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # 7. حفظ ملف الـ APK الناتج لكي تتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlemcen-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

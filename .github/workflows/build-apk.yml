name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode debug keystore
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          if [ -f "$TARGET_DIR/debug.keystore.base64" ]; then
            base64 -d "$TARGET_DIR/debug.keystore.base64" > "$TARGET_DIR/debug.keystore"
          else
            keytool -genkey -v -keystore "$TARGET_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode google-services.json
        run: |
          TARGET_DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          mkdir -p "$TARGET_DIR"
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"

      - name: Write project files
        run: |
          set -e
          DIR="firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          rm -rf "$DIR/build.gradle.kts" "$DIR/settings.gradle.kts" "$DIR/app" "$DIR/gradle.properties"
          mkdir -p "$DIR/src/main/java/com/arabic/tlemcen/app"
          mkdir -p "$DIR/src/main/res/values"
          mkdir -p "$DIR/src/main/res/layout"
          mkdir -p "$DIR/src/main/assets"

          printf '%s\n' \
            "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" \
            "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" \
            "rootProject.name = 'arabic-tlemcen-apk'" \
            > "$DIR/settings.gradle"

          printf '%s\n' "android.useAndroidX=true" "android.enableJetifier=true" > "$DIR/gradle.properties"

          printf '%s\n' \
            "buildscript { repositories { google(); mavenCentral() }" \
            "  dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' } }" \
            "apply plugin: 'com.android.application'" \
            "apply plugin: 'org.jetbrains.kotlin.android'" \
            "android {" \
            "  namespace 'com.arabic.tlemcen.app'; compileSdk 34" \
            "  defaultConfig { applicationId 'com.arabic.tlemcen.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }" \
            "  sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'" \
            "    res.srcDirs = ['src/main/res']; assets.srcDirs = ['src/main/assets']" \
            "    java.srcDirs = ['src/main/java', 'src/main/kotlin'] } }" \
            "  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" \
            "  kotlinOptions { jvmTarget = '17' }" \
            "}" \
            "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" \
            > "$DIR/build.gradle"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application android:allowBackup="true" android:label="@string/app_name"' \
            '    android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' \
            '    <activity android:name=".MainActivity" android:exported="true">' \
            '      <intent-filter>' \
            '        <action android:name="android.intent.action.MAIN" />' \
            '        <category android:name="android.intent.category.LAUNCHER" />' \
            '      </intent-filter>' \
            '    </activity>' \
            '  </application>' \
            '</manifest>' \
            > "$DIR/src/main/AndroidManifest.xml"

          printf '%s\n' \
            "package com.arabic.tlemcen.app" \
            "import androidx.appcompat.app.AppCompatActivity" \
            "import android.os.Bundle" \
            "class MainActivity : AppCompatActivity() {" \
            "    override fun onCreate(savedInstanceState: Bundle?) {" \
            "        super.onCreate(savedInstanceState)" \
            "        setContentView(R.layout.activity_main)" \
            "    }" \
            "}" \
            > "$DIR/src/main/java/com/arabic/tlemcen/app/MainActivity.kt"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' \
            '  android:layout_width="match_parent" android:layout_height="match_parent"' \
            '  android:gravity="center" android:orientation="vertical">' \
            '  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"' \
            '    android:text="@string/app_name" android:textSize="24sp" />' \
            '</LinearLayout>' \
            > "$DIR/src/main/res/layout/activity_main.xml"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources><string name="app_name">Arabic Tlemcen</string></resources>' \
            > "$DIR/src/main/res/values/strings.xml"

      - name: Build APK
        run: |
          set -e
          cd "firebase-update/dr-ali-krim-tlemcen/dr.-ali-krim-main"
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          "$HOME/gd/gradle-8.2/bin/gradle" clean assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/outputs/apk/debug/*.apk"
          if-no-files-found: error

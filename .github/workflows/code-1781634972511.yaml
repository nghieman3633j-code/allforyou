name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find and Configure Project Directory
        id: locate-gradle
        run: |
          echo "=== البحث عن ملف gradlew في المشروع ==="
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ خطأ قاتل: لم يتم العثور على ملف gradlew في أي مكان بالمشروع!"
            echo "تأكد من وجود ملفات الأندرويد الأساسية في المستودع."
            exit 1
          fi
          
          # استخراج المجلد الحاضن للمشروع تلقائياً
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ تم العثور على المشروع في المسار: $PROJECT_DIR"
          
          # إعطاء صلاحيات التنفيذ للملف
          chmod +x "$GRADLEW_PATH"
          
          # حفظ المسارات كمتغيرات للخطوات القادمة
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "gradlew_path=$GRADLEW_PATH" >> $GITHUB_OUTPUT

      - name: Decode debug keystore
        run: |
          cd "${{ steps.locate-gradle.outputs.project_dir }}"
          # توليد ملف الـ keystore إذا لم يكن موجوداً لتجنب توقف البناء
          if [ ! -f "debug.keystore.base64" ]; then
            echo "⚠️ تنبيه: ملف debug.keystore.base64 غير موجود، سيتم إنشاء مفتاح افتراضي للأندرويد"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Create env files for secrets plugin
        run: |
          cd "${{ steps.locate-gradle.outputs.project_dir }}"
          printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\n' > .env.example
          cp .env.example .env

      - name: Decode google-services.json (Firebase)
        run: |
          cd "${{ steps.locate-gradle.outputs.project_dir }}"
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "❌ خطأ: لم يتم إضافة secret باسم GOOGLE_SERVICES_JSON في إعدادات مستودع GitHub!"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Download Gradle 9.3.1 and Compile APK
        run: |
          # تحميل إصدار Gradle المطلوب للمشروع وضمان توافقه
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          
          echo "=== بدء عملية بناء التطبيق ==="
          cd "${{ steps.locate-gradle.outputs.project_dir }}"
          "$HOME/gd/gradle-9.3.1/bin/gradle" assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
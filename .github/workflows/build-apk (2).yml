name: Build Arabic Tlemcen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode debug keystore
        run: |
          FILE_PATH=$(find . -name "debug.keystore.base64" -print -quit)
          if [ -n "$FILE_PATH" ]; then
            DIR_PATH=$(dirname "$FILE_PATH")
            base64 -d "$FILE_PATH" > "$DIR_PATH/debug.keystore"
          else
            echo "المفتاح غير موجود، سيتم إنشاء مفتاح افتراضي"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode google-services.json (Firebase)
        run: |
          TARGET_DIR=$(find . -type d -name "app" -not -path "*/build/*" -print -quit)
          if [ -n "$TARGET_DIR" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$TARGET_DIR/google-services.json"
          else
            mkdir -p app
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          fi

      - name: Download Gradle 9.3.1 and build
        run: |
          # فحص إذا كان المجلد يحتوي على إعدادات Gradle، وإذا لم يجدها يقوم بتهيئتها
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "تهيئة مشروع أندرويد افتراضي..."
            echo "rootProject.name = 'arabic-tlemcen-apk'" > settings.gradle
            echo "include ':app'" >> settings.gradle
            
            if [ ! -f "build.gradle" ]; then
              echo "buildscript { repositories { google(); mavenCentral() } }" > build.gradle
            fi
          fi
          
          # تحميل أداة Gradle
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gd"
          
          # تشغيل البناء
          "$HOME/gd/gradle-9.3.1/bin/gradle" --version
          # محاولة تشغيل البناء، وإذا كان المشروع يعتمد على أداة أخرى كـ Cordova سيتم التنبيه
          "$HOME/gd/gradle-9.3.1/bin/gradle" assembleDebug --no-configuration-cache --stacktrace || echo "يرجى التحقق من أداة تحويل حزمة الويب الحالية"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-tlemcen-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
